<!DOCTYPE html>
<html>
<head>
    <title>Sludge Emptying Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map { height: 100vh; }
    </style>
</head>
<body>
    <h2>Sludge Emptying Heat Map</h2>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        let map = L.map('map').setView([20, 80], 5); // India center

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let locations = {{ locations|tojson }};

        locations.forEach(loc => {
            // Days remaining till emptying
            let today = new Date();
            let next = new Date(loc.next_emptying_date);
            let diffDays = (next - today) / (1000*60*60*24);

            // Define color scale
            let color = diffDays < 30 ? "red" : diffDays < 90 ? "orange" : "green";

            L.circleMarker([loc.latitude, loc.longitude], {
                radius: 8,
                color: color,
                fillOpacity: 0.8
            }).addTo(map).bindPopup(`
                <b>Next Emptying:</b> ${loc.next_emptying_date}<br>
                <b>People:</b> ${loc.A / loc.q}<br>
                <b>Volume:</b> ${loc.volume_litres} L
            `);
        });
    </script>
</body>
</html>
