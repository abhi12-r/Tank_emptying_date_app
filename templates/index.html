<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tank Emptying Form</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { margin-bottom: 20px; }
    label { display: block; margin-top: 10px; }
    #result { margin-top: 20px; font-weight: bold; color: green; }
  </style>
</head>
<body>
  <h1>Tank Emptying Form</h1>

  <form id="tankForm">
    <label>Email:
      <input type="email" name="email" required>
    </label>
    <label>Latitude:
      <input type="number" step="any" name="lat" required>
    </label>
    <label>Longitude:
      <input type="number" step="any" name="lon" required>
    </label>
    <label>Population (P):
      <input type="number" name="P" required>
    </label>
    <label>Per capita waste (q, L/day):
      <input type="number" name="q" required>
    </label>
    <label>Sludge accumulation rate (F, L/person/year):
      <input type="number" name="F" required>
    </label>
    <label>Scum factor (S):
      <input type="number" name="S" required>
    </label>
    <label>Tank Shape:
      <select name="shape">
        <option value="cylinder">Cylinder</option>
        <option value="rectangle">Rectangle</option>
      </select>
    </label>
    <label>Tank Volume (litres):
      <input type="number" name="volume_litres" required>
    </label>
    <label>Design Life (years):
      <input type="number" name="N_years" required>
    </label>
    <button type="submit">Submit</button>
  </form>

  <div id="result"></div>

  <script>
    // Your deployed Google Apps Script Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqb7rO2tTM1bumy2GoRFXuz22Ssl522zeLR8cc3VKQadbrqGD9EI-PUv-9dWtQk1fzCA/exec";

    document.getElementById("tankForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      let data = Object.fromEntries(formData.entries());

      // Compute emptying date
      let today = new Date();
      let emptyDate = new Date();
      emptyDate.setFullYear(today.getFullYear() + parseInt(data.N_years));
      data.next_emptying_date = emptyDate.toISOString().split('T')[0];

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(data),
          headers: { "Content-Type": "application/json" }
        });
        document.getElementById("result").innerText =
          `✅ Data saved! Next emptying date: ${data.next_emptying_date}`;
      } catch (err) {
        document.getElementById("result").innerText = "❌ Error saving data!";
      }
    });
  </script>
</body>
</html>
