<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tank Emptying Date App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      color: #333;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #0066cc;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #004d99;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: #eaf7ea;
      border: 1px solid #b2d8b2;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h2>Tank Emptying Date Calculator</h2>

  <form id="tankForm">
    <label>Email:</label>
    <input type="email" name="email" required>

    <label>Latitude:</label>
    <input type="number" step="any" name="lat" required>

    <label>Longitude:</label>
    <input type="number" step="any" name="lon" required>

    <label>Tank Shape:</label>
    <select name="shape" required>
      <option value="cylindrical">Cylindrical</option>
      <option value="rectangular">Rectangular</option>
    </select>

    <label>Tank Volume (litres):</label>
    <input type="number" name="volume_litres" required>

    <label>Population Served (P):</label>
    <input type="number" name="P" required>

    <label>Wastewater Generation (q, L/person/day):</label>
    <input type="number" name="q" required>

    <label>Sludge Accumulation Rate (F, L/person/year):</label>
    <input type="number" name="F" required>

    <label>Scum Storage (S, L/person):</label>
    <input type="number" name="S" required>

    <label>Design Period (N years):</label>
    <input type="number" name="N_years" required>

    <button type="submit">Submit</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById("tankForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const formData = new FormData(this);
      const data = {};
      formData.forEach((value, key) => { data[key] = value });

      let response = await fetch("/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      let result = await response.json();
      document.getElementById("result").style.display = "block";
      document.getElementById("result").innerHTML = 
        `<b>Next Emptying Date:</b> ${result.next_emptying_date} <br>
         A confirmation mail has been sent to <b>${data.email}</b>.`;
    });
  </script>
</body>
</html>
